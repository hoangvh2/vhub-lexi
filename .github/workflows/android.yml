name: Android

on:
  push:
    paths: &paths
      - "android/**"
      - "shared/**"
      - "tools/dict/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Core tests, lint, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Offline dictionary pack (CMUdict + WordNet) into the APK assets
        working-directory: .
        run: node tools/dict/build.ts --copy-android
      - name: Build
        # Firebase identifiers come from repository variables; unset = phone-only build.
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASE_WEB_CLIENT_ID }}
          FUNCTIONS_REGION: ${{ vars.FUNCTIONS_REGION }}
        run: ./gradlew --no-daemon :core:test :app:lintRelease :app:assembleRelease
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/
          if-no-files-found: ignore
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Lexi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lexi-apk
          path: android/Lexi.apk
