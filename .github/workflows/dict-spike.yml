name: Dictionary spike (Wiktionary vi)

on:
  push:
    branches: [spike/wiktionary-vi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dictionary pack
        run: node tools/dict/build.ts
      - name: Download sources
        run: |
          mkdir -p /tmp/sp && cd /tmp/sp
          curl -sSfL -o en.jsonl https://kaikki.org/dictionary/English/kaikki.org-dictionary-English.jsonl
          curl -sSfL https://kaikki.org/viwiktionary/raw-wiktextract-data.jsonl.gz | gunzip > vi.jsonl
          curl -sSfL -o freq.txt https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-usa.txt
          ls -la; head -c 600 vi.jsonl; echo; grep -m1 '"vi"' en.jsonl | head -c 600
      - name: Measure coverage
        run: node tools/dict/spike/measure.mjs dist-dict/$(node -p "require('./dist-dict/latest.json').version") /tmp/sp/en.jsonl /tmp/sp/vi.jsonl /tmp/sp/freq.txt
