name: Dictionary spike (Wiktionary vi)

on:
  push:
    branches: [spike/wiktionary-vi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover kaikki.org raw data files
        run: |
          for p in https://kaikki.org/dictionary/rawdata.html https://kaikki.org/dictionary/English/index.html https://kaikki.org/viwiktionary/rawdata.html https://kaikki.org/viwiktionary/index.html; do
            echo "== $p"
            curl -sSL "$p" | grep -oE 'href="[^"]*(jsonl|gz|json)[^"]*"' | head -40 || true
          done
